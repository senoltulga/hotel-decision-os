<script>
/* ===== Değerleme modülü (v2.1) · gelir kapitalizasyonu + hedef geri dönüşten azami fiyat ===== */
(function(){
const VL0=()=>({cur:"USD",dev:[-19,0,18],cap:[10,8.5,7.5],targets:[8,10,12,15],offer:0,comp:0});
window.VL=VL0();
const f0=n=>new Intl.NumberFormat("tr-TR",{maximumFractionDigits:0}).format(Math.round(n));
const f1=n=>new Intl.NumberFormat("tr-TR",{minimumFractionDigits:1,maximumFractionDigits:1}).format(n);
const f2=n=>new Intl.NumberFormat("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cu=()=>esc(VL.cur||"");
const M=n=>f0(n)+" "+cu();
function vlCalc(){
  const R=tpCalc(),idx=TP.ramp.on?Math.min(R.nR,R.H-1):0,yr=R.yr[idx];
  const noi=yr.net,units=TP.units||0,gross=yr.gross;
  const out={R,idx,yr,noi,units,gross,gop:yr.gop,warn:[]};
  if(!(noi>0))out.warn.push("Stabilize yıl net nakit (NOI) sıfır ya da negatif; kapitalizasyonla değer hesaplanamaz. Şablondaki gelir ve giderleri kontrol edin.");
  out.scen=[0,1,2].map(i=>{const n=noi*(1+(+VL.dev[i]||0)/100),c=+VL.cap[i]||0,v=n>0&&c>0?n/(c/100):null;return{n,c,v,per:v&&units?v/units:null,grm:v&&gross?v/gross:null}});
  const bc=+VL.cap[1]||8.5,caps=[bc-2,bc-1,bc,bc+1,bc+2].filter(x=>x>0),devs=[-20,-10,0,10,20];
  out.caps=caps;out.devs=devs;out.grid=caps.map(c=>devs.map(d=>{const n=noi*(1+d/100);return n>0?n/(c/100):null}));
  out.tgt=(VL.targets||[]).map(y=>{y=Math.round(+y);return{y,p:y>=1&&y<=R.H?R.cum[y-1]:null}});
  const offer=+VL.offer||0;out.offer=offer;
  if(offer>0&&noi>0){let p=null;for(let i=0;i<R.H;i++)if(R.cum[i]>=offer){const pr=i?R.cum[i-1]:0;p=R.yr[i].net>0?i+(offer-pr)/R.yr[i].net:i+1;break}
    out.of={cap:noi/offer*100,pb:p,diff:out.scen[1].v?offer/out.scen[1].v*100-100:null,per:units?offer/units:null}}
  const comp=+VL.comp||0;out.comp=comp;
  if(comp>0&&out.scen[1].v)out.cmp={gap:comp/out.scen[1].v*100-100};
  if(out.scen[1].c&&(out.scen[1].c<6||out.scen[1].c>13))out.warn.push("Baz getiri oranı %6–13 aralığının dışında; piyasa verisiyle doğrulayın.");
  return out;
}
const inp=(path,v,st,w)=>`<input class="tin" style="width:${w||90}px" type="number" step="${st||0.5}" data-vl="${path}" value="${v}">`;
function renderVL(){
  const el=document.getElementById("vlp");if(!el)return;
  let c;try{c=vlCalc()}catch(e){el.innerHTML='<p class="note">Değerleme hesaplanamadı: '+esc(e.message)+". Şablon verisini kontrol edin.</p>";return}
  const nm=["Düşük","Baz","Yüksek"],yrLabel=TP.ramp.on?`${c.idx+1}. yıl (ilk stabilize yıl)`:"1. yıl";
  const bars=(()=>{const mx=Math.max(1,...c.scen.map(s=>s.v||0));return c.scen.map((s,i)=>`<div style="display:grid;grid-template-columns:70px 1fr 160px;gap:10px;align-items:center;margin:6px 0"><span>${nm[i]}</span><div style="background:var(--line,#d9e0e6);border-radius:6px;height:20px"><div style="width:${s.v?Math.round(s.v/mx*100):0}%;height:100%;background:var(--accent,#1c6e6a);border-radius:6px"></div></div><b>${s.v?M(s.v):"—"}</b></div>`).join("")})();
  el.innerHTML=`<div class="plhead"><h2 style="font-size:16px">Değerleme · ${esc(TP.name)}</h2><span class="code">NOI → getiri oranı → değer · hedef geri dönüş → azami fiyat</span></div>
  <p class="note">Değer, işletme gelirinden (gelir kapitalizasyonu) bulunur: <b>Değer = NOI ÷ getiri oranı (cap rate)</b>. NOI burada <b>şablonun net nakdidir</b> (FF&amp;E rezervi düşülmüş, kredi ve gelir vergisi öncesi). Gelir ve gider değerleri <b>Şablonlar → Payback analizi</b> ekranındaki girdilerden gelir. Getiri oranları ve senaryo sapmaları varsayımdır, piyasa verisiyle doğrulanmadı.</p>
  <div class="dc-g"><h3>1 · Girdiler</h3>
   <div class="oz-row"><label>Para birimi gösterimi<input class="tin" style="width:90px" type="text" data-vl="cur" value="${esc(VL.cur)}"></label>
   <label>Düşük · NOI sapması %${inp("dev.0",VL.dev[0],1)}</label><label>Baz · NOI sapması %${inp("dev.1",VL.dev[1],1)}</label><label>Yüksek · NOI sapması %${inp("dev.2",VL.dev[2],1)}</label></div>
   <div class="oz-row"><label>Düşük · getiri oranı %${inp("cap.0",VL.cap[0])}</label><label>Baz · getiri oranı %${inp("cap.1",VL.cap[1])}</label><label>Yüksek · getiri oranı %${inp("cap.2",VL.cap[2])}</label></div>
   <div class="oz-row"><label>Hedef geri dönüş yılları (virgülle)<input class="tin" style="width:160px" type="text" data-vl="targets" value="${esc((VL.targets||[]).join(", "))}"></label>
   <label>Teklif / ödenecek fiyat (opsiyonel)${inp("offer",VL.offer||0,1000,130)}</label><label>Emsal / beklenen fiyat (opsiyonel)${inp("comp",VL.comp||0,1000,130)}</label></div>
   <p class="note">Senaryo: Düşük ve yüksek senaryoda NOI, baz NOI'ye göre yüzde olarak sapar; getiri oranı da buna göre yükselir ya da düşer.</p></div>
  <div class="dc-g"><h3>2 · Stabilize yıl göstergeleri (${yrLabel})</h3>
   <div class="wrap"><table class="ozt"><tbody>
    <tr><td>Brüt gelir</td><td style="text-align:right">${M(c.gross)}</td></tr>
    <tr><td>GOP</td><td style="text-align:right">${M(c.gop)}</td></tr>
    <tr><td><b>NOI (net nakit)</b></td><td style="text-align:right"><b>${M(c.noi)}</b></td></tr>
    <tr><td>Ünite sayısı</td><td style="text-align:right">${f0(c.units)}</td></tr></tbody></table></div></div>
  ${c.warn.map(w=>`<p class="note" style="color:var(--bad,#b3261e)"><b>Uyarı:</b> ${esc(w)}</p>`).join("")}
  <div class="dc-g"><h3>3 · Değer senaryoları</h3>
   <div class="wrap"><table class="ozt"><thead><tr><th></th>${nm.map(n=>`<th style="text-align:right">${n}</th>`).join("")}</tr></thead><tbody>
    <tr><td>NOI</td>${c.scen.map(s=>`<td style="text-align:right">${M(s.n)}</td>`).join("")}</tr>
    <tr><td>Getiri oranı</td>${c.scen.map(s=>`<td style="text-align:right">%${f1(s.c)}</td>`).join("")}</tr>
    <tr><td><b>Tahmini değer</b></td>${c.scen.map(s=>`<td style="text-align:right"><b>${s.v?M(s.v):"—"}</b></td>`).join("")}</tr>
    <tr><td>Ünite başına değer</td>${c.scen.map(s=>`<td style="text-align:right">${s.per?M(s.per):"—"}</td>`).join("")}</tr>
    <tr><td>Değer ÷ brüt gelir</td>${c.scen.map(s=>`<td style="text-align:right">${s.grm?f1(s.grm)+"×":"—"}</td>`).join("")}</tr></tbody></table></div>
   <div style="margin-top:10px">${bars}</div></div>
  <div class="dc-g"><h3>4 · Getiri oranı ve NOI duyarlılığı (değer)</h3>
   <div class="wrap"><table class="ozt"><thead><tr><th>Getiri oranı ↓ · NOI sapması →</th>${c.devs.map(d=>`<th style="text-align:right">${d>0?"+":""}${d}%</th>`).join("")}</tr></thead><tbody>
   ${c.caps.map((cp,i)=>`<tr><td>%${f1(cp)}</td>${c.grid[i].map(v=>`<td style="text-align:right">${v?f0(v):"—"}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>
  <div class="dc-g"><h3>5 · Hedef geri dönüş süresine göre azami fiyat</h3>
   <p class="note">Şablonun birikimli net nakdine göre: o yılda yatırımı geri kazanmak için ödenebilecek en yüksek fiyat.</p>
   <div class="wrap"><table class="ozt"><thead><tr><th>Hedef süre</th><th style="text-align:right">Azami fiyat</th><th style="text-align:right">Ünite başı</th></tr></thead><tbody>
   ${c.tgt.map(t=>`<tr><td>${t.y} yıl</td><td style="text-align:right">${t.p?M(t.p):"—"}</td><td style="text-align:right">${t.p&&c.units?M(t.p/c.units):"—"}</td></tr>`).join("")}</tbody></table></div></div>
  ${c.of?`<div class="dc-g"><h3>6 · Teklif analizi</h3><div class="wrap"><table class="ozt"><tbody>
   <tr><td>Teklif / fiyat</td><td style="text-align:right">${M(c.offer)}</td></tr>
   <tr><td>Getiri (NOI ÷ fiyat)</td><td style="text-align:right">%${f2(c.of.cap)}</td></tr>
   <tr><td>Basit geri dönüş</td><td style="text-align:right">${c.of.pb?f1(c.of.pb)+" yıl":"ufukta dönmüyor"}</td></tr>
   <tr><td>Ünite başına</td><td style="text-align:right">${c.of.per?M(c.of.per):"—"}</td></tr>
   <tr><td>Baz değere göre</td><td style="text-align:right">${c.of.diff==null?"—":(c.of.diff>0?"+":"")+f1(c.of.diff)+"%"}</td></tr></tbody></table></div></div>`:""}
  ${c.cmp?`<p class="note"><b>Emsal karşılaştırması:</b> Girdiğiniz emsal/beklenen fiyat, baz gelir değerinden %${f1(Math.abs(c.cmp.gap))} ${c.cmp.gap>=0?"yüksek":"düşük"}. Fiyat gelir değerinin üzerindeyse alıcı gelir dışında bir değere (arsa, konum, imar, gelecek beklentisi) para ödüyor demektir.</p>`:""}
  <p class="note">Bu bir <b>gelir değeri</b> tahminidir; yatırım tavsiyesi değildir. Arsa-bina emsal satışları, ruhsat ve imar durumu, fiziksel durum ve kira sözleşmeleri ayrıca değerlendirilmelidir. Sonuç, şablondaki gelir ve gider varsayımlarına ve getiri oranına duyarlıdır.</p>`;
}
window.renderVL=renderVL;
/* sayfa kabuğu */
const host=document.getElementById("tpwrap");
if(host&&!document.getElementById("vlwrap")){const w=document.createElement("div");w.id="vlwrap";w.hidden=true;w.style.cssText="display:grid;gap:16px;min-width:0";w.innerHTML='<section class="card"><div id="vlp"></div></section>';host.parentNode.insertBefore(w,host.nextSibling)}
/* showView / go / renderMenu sarmalayıcıları */
const sv=window.showView;window.showView=function(){const r=sv.apply(this,arguments);const w=document.getElementById("vlwrap");if(w)w.hidden=VIEWSEC!=="vl";return r};
const gg=window.go;window.go=function(sec){const r=gg.apply(this,arguments);if(sec==="vl")renderVL();return r};
const rm=window.renderMenu;window.renderMenu=function(){const r=rm.apply(this,arguments);try{const m=document.getElementById("menu"),d=m&&m.querySelector('[data-go="db"]');if(d&&!m.querySelector('[data-go="vl"]'))d.insertAdjacentHTML("beforebegin",`<button type="button" class="mi mt" data-go="vl" aria-current="${VIEWSEC==="vl"}"><span>Değerleme</span><span class="vl">NOI ÷ getiri oranı</span></button>`)}catch(e){}return r};
/* girdi dinleyici */
document.addEventListener("change",e=>{const el=e.target;if(!el||el.dataset.vl===undefined)return;const k=el.dataset.vl;
  if(k==="cur")VL.cur=el.value.slice(0,8);
  else if(k==="targets")VL.targets=el.value.split(/[,;\s]+/).map(Number).filter(x=>x>=1&&x<=40).slice(0,6);
  else if(k==="offer"||k==="comp")VL[k]=Math.max(0,+el.value||0);
  else{const[a,i]=k.split(".");VL[a][+i]=+el.value||0}
  renderVL()},true);
/* proje kaydı */
const ps=window.projSnap;window.projSnap=function(){const s=ps.apply(this,arguments);s.data.vl=JSON.parse(JSON.stringify(VL));return s};
const pa=window.projApply;window.projApply=function(o){const er=pa.apply(this,arguments);if(!er&&o&&o.data&&o.data.vl){VL={...VL0(),...o.data.vl};window.VL=VL}else if(!er){window.VL=VL0()}return er};
renderMenu();
})();
</script>
